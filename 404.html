<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B0E14">
    <title>P&aacute;gina no encontrada | GhostKey</title>
    <link rel="icon" href="/img/favicon-32x32.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #f4efff;
            background: radial-gradient(ellipse at top, #261d3a, #0b0e14 60%);
            font-family: system-ui, sans-serif;
        }
        main {
            width: min(100%, 540px);
            padding: clamp(24px, 6vw, 48px);
            border: 1px solid #3e3451;
            border-radius: 24px;
            background: #141822;
        }
        img { display: block; margin-bottom: 24px; object-fit: contain; }
        h1 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.5rem); }
        p { color: #c3bccf; line-height: 1.6; margin: 12px 0 24px; }
        nav { display: flex; flex-wrap: wrap; gap: 12px; }
        a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 8px 16px;
            border-radius: 12px;
            color: #f4efff;
            border: 1px solid #6d5d8d;
            text-decoration: none;
            font-weight: 650;
        }
        a:first-child { border-color: #c8b4ff; background: #c8b4ff; color: #171222; }
        a:hover { text-decoration: underline; }
        a:focus-visible { outline: 2px solid #c8b4ff; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <img src="/img/ghost-logo.png" width="52" height="52" alt="GhostKey">
        <h1>P&aacute;gina no encontrada</h1>
        <p>La direcci&oacute;n puede haber cambiado o el enlace puede estar incompleto.</p>
        <nav aria-label="Volver a la tienda">
            <a href="/">Volver al inicio</a>
            <a href="/catalogo.html">Explorar cat&aacute;logo</a>
        </nav>
    </main>
</body>
</html>
